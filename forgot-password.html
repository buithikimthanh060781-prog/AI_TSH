<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu — Thần Số Học Pythagoras</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page-wrap {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">✨</span>
        <span>Thần Số Học Pythagoras</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">Quay về trang chủ</a>
    </div>
  </header>

  <div class="auth-page-wrap">
    <div class="auth-box">
      <h2 style="font-size: 1.6rem; margin-bottom: 8px;">Quên Mật Khẩu?</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">
        Nhập địa chỉ email tài khoản của bạn để nhận liên kết đặt lại mật khẩu an toàn.
      </p>

      <div id="forgot-msg" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.9rem;"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label">Địa chỉ Email</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          Gửi Hướng Dẫn Đặt Lại
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
        <a href="index.html">← Quay lại Đăng nhập</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      const msgBox = document.getElementById('forgot-msg');

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(16, 185, 129, 0.2)';
        msgBox.style.border = '1px solid #10b981';
        msgBox.style.color = '#6ee7b7';
        msgBox.textContent = data.message || 'Hướng dẫn đã được gửi!';
      } catch (err) {
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(239, 68, 68, 0.2)';
        msgBox.style.border = '1px solid #ef4444';
        msgBox.style.color = '#fca5a5';
        msgBox.textContent = 'Không thể gửi yêu cầu. Vui lòng thử lại sau.';
      }
    });
  </script>
</body>
</html>
