<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Bài Viết CMS — Thần Số Học Pythagoras</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Quill Editor CSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    .admin-header {
      background: #090d16;
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
    }
    .admin-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-tabs {
      display: flex;
      gap: 12px;
    }
    .admin-tab-link {
      padding: 8px 16px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
    }
    .admin-tab-link.active, .admin-tab-link:hover {
      background: var(--bg-card);
      color: var(--primary);
    }
    .admin-container {
      max-width: 1240px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }
    .admin-card-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px;
      margin-bottom: 30px;
    }
    .ql-toolbar {
      background: var(--bg-card);
      border-color: var(--border-color) !important;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .ql-container {
      background: var(--bg-card);
      border-color: var(--border-color) !important;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      color: #fff;
      font-size: 1rem;
      min-height: 250px;
    }
    .ql-stroke { stroke: #cbd5e1 !important; }
    .ql-fill { fill: #cbd5e1 !important; }
    .ql-picker-label { color: #cbd5e1 !important; }
    .ql-editor { min-height: 250px; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="container admin-nav">
      <div class="brand-logo">
        <span class="brand-icon">🛡️</span>
        <span>Hệ Thống Quản Trị Thần Số Học</span>
      </div>

      <div class="admin-tabs">
        <a href="admin.html" class="admin-tab-link">👥 Quản lý thành viên</a>
        <a href="admin-posts.html" class="admin-tab-link active">📝 Quản lý bài viết (CMS)</a>
        <a href="kien-thuc.html" target="_blank" class="admin-tab-link">📚 Xem thư viện</a>
      </div>

      <div>
        <a href="admin.html" class="btn btn-outline btn-sm">Quay về quản trị</a>
      </div>
    </div>
  </header>

  <main class="admin-container">
    <!-- Form Soạn thảo / Chỉnh sửa -->
    <div class="admin-card-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 id="form-heading" style="font-size: 1.4rem;">📝 Soạn Bài Viết Mới</h2>
        <button type="button" class="btn btn-outline btn-sm" id="btn-cancel-edit" style="display: none;" onclick="cancelEdit()">Hủy chỉnh sửa</button>
      </div>

      <form id="post-editor-form">
        <input type="hidden" id="edit-post-id" value="">

        <div class="form-group">
          <label class="form-label">Tiêu đề bài viết</label>
          <input type="text" id="post-title" class="form-control" placeholder="Nhập tiêu đề hấp dẫn..." required>
        </div>

        <div class="form-group">
          <label class="form-label">Mô tả ngắn (Summary tóm tắt)</label>
          <textarea id="post-summary" class="form-control" rows="2" placeholder="Tóm tắt 1-2 câu về nội dung bài viết..."></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div class="form-group">
            <label class="form-label">Ảnh bìa (URL hoặc tải lên)</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="post-cover-image" class="form-control" placeholder="https://images.unsplash.com/...">
              <label class="btn btn-outline btn-sm" style="margin: 0; cursor: pointer; white-space: nowrap;">
                Tải ảnh lên 📁
                <input type="file" id="cover-file-input" accept="image/*" style="display: none;">
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Tệp đính kèm (Tối đa 15MB: pdf, docx, zip...)</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="post-attachment-name" class="form-control" placeholder="Chưa có tệp đính kèm" readonly>
              <input type="hidden" id="post-attachment-path" value="">
              <label class="btn btn-outline btn-sm" style="margin: 0; cursor: pointer; white-space: nowrap;">
                Chọn tệp 📎
                <input type="file" id="attachment-file-input" style="display: none;">
              </label>
            </div>
          </div>
        </div>

        <!-- Quill Editor -->
        <div class="form-group">
          <label class="form-label">Nội dung chi tiết bài viết</label>
          <div id="quill-editor"></div>
        </div>

        <!-- Status & Actions -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-color);">
          <div style="display: flex; align-items: center; gap: 12px;">
            <label class="form-label" style="margin: 0;">Trạng thái:</label>
            <select id="post-status" class="form-control" style="width: 180px;">
              <option value="published">Xuất bản ngay</option>
              <option value="draft">Lưu bản nháp</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-save-post">
            💾 Lưu Bài Viết
          </button>
        </div>
      </form>
    </div>

    <!-- Danh Sách Bài Viết Đã Đăng -->
    <div class="admin-card-box">
      <h3 style="font-size: 1.3rem; margin-bottom: 20px;">📚 Tất Cả Bài Viết Trong Thư Viện</h3>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tiêu đề</th>
              <th>Trạng thái</th>
              <th>Lượt xem</th>
              <th>Ngày tạo</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="posts-table-body">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Đang tải danh sách bài viết...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Quill JS CDN -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="js/admin-posts.js"></script>
</body>
</html>
