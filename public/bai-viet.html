<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Bài Viết — Thần Số Học Pythagoras</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .article-reader {
      max-width: 820px;
      margin: 40px auto 80px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
    }
    .article-reader-cover {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-bottom: 30px;
    }
    .article-meta {
      display: flex;
      gap: 16px;
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .article-heading {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 24px;
    }
    .article-body {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #334155;
    }
    .article-body h2 {
      font-size: 1.5rem;
      color: #0f172a;
      margin: 32px 0 16px;
      border-left: 4px solid var(--primary);
      padding-left: 12px;
    }
    .article-body h3 {
      font-size: 1.25rem;
      color: var(--primary);
      margin: 24px 0 12px;
    }
    .article-body p {
      margin-bottom: 20px;
    }
    .article-body ul, .article-body ol {
      margin: 0 0 24px 24px;
    }
    .article-body li {
      margin-bottom: 8px;
    }
    .article-attachment-box {
      margin-top: 40px;
      padding: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">✨</span>
        <span>Thần Số Học Pythagoras</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Trang chủ</a>
        <a href="index.html#lookup" class="nav-link">Tra cứu</a>
        <a href="kien-thuc.html" class="nav-link active">Kiến thức</a>
        <a href="lienhe.html" class="nav-link">Liên hệ</a>
      </nav>
      <div class="header-actions">
        <a href="kien-thuc.html" class="btn btn-outline btn-sm">← Danh sách bài viết</a>
      </div>
    </div>
  </header>

  <main class="container">
    <article class="article-reader" id="article-container">
      <div style="text-align: center; color: var(--text-muted); padding: 60px;">
        Đang tải bài viết...
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© 2026 Thần Số Học Pythagoras. Bảo lưu mọi quyền.</p>
    </div>
  </footer>

  <script>
    async function loadPostDetail() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        window.location.href = '/kien-thuc.html';
        return;
      }

      try {
        const res = await fetch(`/api/posts/${slug}`);
        const data = await res.json();
        if (!res.ok || !data.post) {
          document.getElementById('article-container').innerHTML = `
            <div style="text-align: center; padding: 40px;">
              <h2>Không tìm thấy bài viết</h2>
              <p style="color: var(--text-muted); margin: 16px 0;">Bài viết không tồn tại hoặc đã được gỡ xuống.</p>
              <a href="kien-thuc.html" class="btn btn-primary">Quay lại thư viện</a>
            </div>
          `;
          return;
        }

        const post = data.post;
        document.title = `${post.title} — Thần Số Học Pythagoras`;

        const d = new Date(post.created_at);
        const dateStr = d.toLocaleDateString('vi-VN');
        const readTime = Math.max(1, Math.round((post.content.length || 500) / 800));

        let attachmentHtml = '';
        if (post.attachment_path) {
          attachmentHtml = `
            <div class="article-attachment-box">
              <div>
                <strong>📎 Tệp đính kèm:</strong>
                <span style="color: var(--text-muted); margin-left: 8px;">${post.attachment_name || 'Tài liệu'}</span>
              </div>
              <a href="${post.attachment_path}" download class="btn btn-primary btn-sm">Tải về máy ↓</a>
            </div>
          `;
        }

        document.getElementById('article-container').innerHTML = `
          ${post.cover_image ? `<img src="${post.cover_image}" alt="${post.title}" class="article-reader-cover">` : ''}
          <div class="article-meta">
            <span>📅 Ngày đăng: ${dateStr}</span>
            <span>⏱️ Khoảng ${readTime} phút đọc</span>
            <span>👁️ ${post.view_count} lượt xem</span>
          </div>
          <h1 class="article-heading">${post.title}</h1>
          <div class="article-body">
            ${post.content}
          </div>
          ${attachmentHtml}
          <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between;">
            <a href="kien-thuc.html" class="btn btn-outline btn-sm">← Quay lại danh sách</a>
            <a href="index.html#lookup" class="btn btn-primary btn-sm">Tra cứu bản đồ của bạn ⚡</a>
          </div>
        `;
      } catch (err) {
        document.getElementById('article-container').innerHTML = `
          <div style="text-align: center; color: #f87171; padding: 40px;">
            Lỗi kết nối khi tải bài viết. Vui lòng thử lại.
          </div>
        `;
      }
    }

    loadPostDetail();
  </script>
</body>
</html>
