<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị — Thần Số Học Pythagoras</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f8fafc;
    }
    .admin-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="admin-login-wrap">
    <div class="admin-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-size: 2.5rem;">🛡️</span>
        <h2 style="font-size: 1.5rem; margin-top: 8px;">Cổng Quản Trị Hệ Thống</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Dành riêng cho Quản trị viên</p>
      </div>

      <div id="login-error" class="auth-error"></div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label">Tên đăng nhập</label>
          <input type="text" id="admin-username" class="form-control" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mật khẩu quản trị</label>
          <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          Đăng Nhập Quản Trị
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px;">
        <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);">← Quay về trang chủ người dùng</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('admin-username').value;
      const p = document.getElementById('admin-password').value;
      const errBox = document.getElementById('login-error');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (!res.ok) {
          errBox.style.display = 'block';
          errBox.textContent = data.message || 'Sai tên đăng nhập hoặc mật khẩu.';
          return;
        }

        window.location.href = '/admin.html';
      } catch (err) {
        errBox.style.display = 'block';
        errBox.textContent = 'Lỗi kết nối máy chủ.';
      }
    });
  </script>
</body>
</html>
