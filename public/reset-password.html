<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Lại Mật Khẩu — Thần Số Học Pythagoras</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page-wrap {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">✨</span>
        <span>Thần Số Học Pythagoras</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">Quay về trang chủ</a>
    </div>
  </header>

  <div class="auth-page-wrap">
    <div class="auth-box">
      <h2 style="font-size: 1.6rem; margin-bottom: 8px;">Thiết Lập Mật Khẩu Mới</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px;">
        Vui lòng tạo mật khẩu mới an toàn cho tài khoản của bạn.
      </p>

      <div id="reset-msg" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.9rem;"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">Mật khẩu mới (tối thiểu 6 ký tự)</label>
          <input type="password" id="new-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
        <div class="form-group">
          <label class="form-label">Xác nhận mật khẩu mới</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          Lưu Mật Khẩu Mới
        </button>
      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      const msgBox = document.getElementById('reset-msg');
      msgBox.style.display = 'block';
      msgBox.style.background = 'rgba(239, 68, 68, 0.2)';
      msgBox.style.color = '#fca5a5';
      msgBox.textContent = 'Mã xác thực không hợp lệ hoặc đã bị thiếu trên đường dẫn.';
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;
      const msgBox = document.getElementById('reset-msg');

      if (p1 !== p2) {
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(239, 68, 68, 0.2)';
        msgBox.style.border = '1px solid #ef4444';
        msgBox.style.color = '#fca5a5';
        msgBox.textContent = 'Hai mật khẩu nhập không khớp nhau.';
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: p1 })
        });
        const data = await res.json();
        if (!res.ok) {
          msgBox.style.display = 'block';
          msgBox.style.background = 'rgba(239, 68, 68, 0.2)';
          msgBox.style.border = '1px solid #ef4444';
          msgBox.style.color = '#fca5a5';
          msgBox.textContent = data.message || 'Lỗi đặt lại mật khẩu.';
          return;
        }

        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(16, 185, 129, 0.2)';
        msgBox.style.border = '1px solid #10b981';
        msgBox.style.color = '#6ee7b7';
        msgBox.innerHTML = `${data.message} <br><br><a href="index.html" class="btn btn-primary btn-sm" style="margin-top:10px;">Đăng nhập ngay</a>`;
        document.getElementById('reset-form').style.display = 'none';
      } catch (err) {
        msgBox.style.display = 'block';
        msgBox.style.background = 'rgba(239, 68, 68, 0.2)';
        msgBox.style.border = '1px solid #ef4444';
        msgBox.style.color = '#fca5a5';
        msgBox.textContent = 'Lỗi kết nối máy chủ.';
      }
    });
  </script>
</body>
</html>
